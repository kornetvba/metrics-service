<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Metrics Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .metric-table {
            width: 100%;
            table-layout: fixed;
        }
        .metric-name {
            width: 60%;
            text-align: left;
            padding-left: 15px;
        }
        .metric-value {
            width: 40%;
            text-align: left;  /* Выравнивание по левому краю */
            padding-left: 30px; /* Фиксированный отступ слева */
        }
        .no-metrics {
            text-align: center;
        }
        /* Гарантируем одинаковое выравнивание */
        .metric-table th.metric-value,
        .metric-table td.metric-value {
            text-align: left !important;
            padding-left: 30px !important;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <h1>Metrics Dashboard</h1>

    <!-- Counters Table -->
    <h2 class="mt-4">Counters</h2>
    <table class="table table-striped metric-table">
        <thead>
        <tr>
            <th class="metric-name">Metric Name</th>
            <th class="metric-value">Value</th>
        </tr>
        </thead>
        <tbody>
        {{range $name, $value := .Counters}}
        <tr>
            <td class="metric-name">{{$name}}</td>
            <td class="metric-value">{{$value}}</td>
        </tr>
        {{else}}
        <tr>
            <td colspan="2" class="no-metrics">No counter metrics</td>
        </tr>
        {{end}}
        </tbody>
    </table>

    <!-- Gauges Table -->
    <h2 class="mt-4">Gauges</h2>
    <table class="table table-striped metric-table">
        <thead>
        <tr>
            <th class="metric-name">Metric Name</th>
            <th class="metric-value">Value</th>
        </tr>
        </thead>
        <tbody>
        {{range $name, $value := .Gauges}}
        <tr>
            <td class="metric-name">{{$name}}</td>
            <td class="metric-value">{{$value}}</td>
        </tr>
        {{else}}
        <tr>
            <td colspan="2" class="no-metrics">No gauge metrics</td>
        </tr>
        {{end}}
        </tbody>
    </table>
</div>
</body>
</html>
